# State-observation PPO on the solver kitchen reach task. Validates the
# RLinf <-> solver integration end to end on a single GPU before moving to
# image policies (solver_kitchen_ppo_cnn.yaml) and GRPO (solver_kitchen_grpo_starvla.yaml).
defaults:
  - env/solver_kitchen@env.train
  - env/solver_kitchen@env.eval
  - model/mlp_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: ${oc.env:SOLVER_KITCHEN_PLACEMENT,0}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:SOLVER_KITCHEN_LOG_ROOT,../results/solver_kitchen}
    project_name: rlinf-solver-kitchen
    experiment_name: solver_kitchen_ppo_mlp
    logger_backends: []
  max_epochs: 200
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 20
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 4
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 1
    max_length: 1
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    reward_mode: solver
    reward_coef: ${algorithm.reward_coef}
    # The MLP policy never looks at pixels; skip rendering for speed.
    render: false
    video_cfg:
      save_video: false
  eval:
    total_num_envs: 32
    group_size: 1
    is_eval: true
    eval_seed_count: 32
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    reward_mode: solver
    reward_coef: ${algorithm.reward_coef}
    render: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_type: mlp_policy
    model_path: ""
    policy_setup: solver_kitchen
    # 16 joint positions + 16 joint velocities + 2 objects x 13 + 4 reach features.
    obs_dim: 62
    action_dim: 16
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: true
    is_lora: false
    lora_rank: 32
  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 0.5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
