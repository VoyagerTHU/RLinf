model_type: "starvla"

# Path to a starVLA checkpoint (.pt under a starVLA run directory)
model_path: "/path/to/model/starvla/checkpoints/step_xxx.pt"

# Precision used by RLinf actor/rollout wrappers.
# Keep aligned with your StarVLA runtime (usually bf16 on A800/H100).
precision: "bf16"

# Optional precision override for only the action model. Set to fp32 when
# fine-tuning a BF16 checkpoint with optimizer steps smaller than BF16's local
# quantization interval; the VLM backbone remains at `precision` above.
action_model_precision: null

# Action/chunk settings used by RLinf wrapper.
# IMPORTANT: must match the checkpoint's action horizon/chunk length.
action_dim: 7
num_action_chunks: 8

# LoRA settings. Set is_lora=true and lora_scope=qwen3_vl to freeze the
# StarVLA action head and train adapters only inside the complete Qwen3-VL
# subtree (vision and language). The default all-linear target is resolved
# within that subtree, so similarly named OFT action-head layers are excluded.
# Set lora_train_action_head=true to train the full action head alongside those
# adapters while keeping the Qwen base weights and actor logstd frozen.
is_lora: False
lora_rank: 32
lora_scope: qwen3_vl
lora_target_modules: all-linear
lora_train_action_head: False

# Common embodied fields used by RLinf validation / env adapters.
use_proprio: True
num_steps: 4
# NOTE: RLinf currently only uses this field for ManiSkill control mode selection.
# It is ignored for LIBERO and most other envs.
policy_setup: "libero"
# starVLA checkpoints expose action normalization stats under a string key.
# For LIBERO Franka tasks, the common key is "franka"; override if your checkpoint differs.
unnorm_key: "franka"
# Choose which checkpoint action-range statistics to use for env unnormalization.
# The official StarVLA LIBERO client uses min/max instead of q01/q99.
action_stats_source: "minmax"

# RL head behavior (wrapper-side value head).
# For GRPO actor-only this can stay False; for PPO actor_critic set to True.
add_value_head: False

# Optional flags (kept for compatibility with other model configs).
trust_remote_code: True
low_cpu_mem_usage: True

# Optional explicit namespace used by rlinf.models.embodiment.starvla.get_model
starvla:
  ckpt_path: ${actor.model.model_path}
  # Unified starVLA wrapper switch for feeding proprio/state into action heads.
  # Applies to Adapter / PI / GR00T / Dual paths. OFT remains state-free.
  enable_state_input: True
  # Informational fields for consistency checks in experiment configs.
  framework_name: "QwenOFT"
  expected_action_dim: ${actor.model.action_dim}
  expected_num_action_chunks: ${actor.model.num_action_chunks}
  expected_image_size: [224, 224]
