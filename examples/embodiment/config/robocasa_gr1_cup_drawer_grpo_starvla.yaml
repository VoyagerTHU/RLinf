defaults:
  - env/robocasa_gr1_cup_drawer@env.train
  - env/robocasa_gr1_cup_drawer@env.eval
  - model/starvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # env and actor MUST have the same world size for grouped GRPO: environment
    # workers split their trajectories across actor ranks purely by batch
    # position, and group-relative advantages are normalized inside each actor
    # rank's local batch. With env=4 / actor=8 every 8-trajectory seed group
    # was cut in half and two different seeds were normalized against each
    # other. `validate_embodied_cfg` now rejects such placements. Four
    # EnvWorkers x 8 simulators = 32 envs = one seed group per worker.
    actor,rollout: ${oc.env:ROBOCASA_GR1_ACTOR_ROLLOUT_PLACEMENT,4-7}
    env: ${oc.env:ROBOCASA_GR1_ENV_PLACEMENT,4-7}

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: ${oc.env:ROBOCASA_GR1_GRPO_LOG_ROOT,/data/dengyixuan/wyz/experiments/rlinf_starvla_robocasa_gr1_grpo_groupfix_20260908}
    project_name: rlinf-starvla-robocasa-gr1
    experiment_name: cup_to_drawer_close_grpo_groupfix_tokenlevel_lr1e6
    # No remote backend: W&B uploads need explicit authorization and the
    # training venv has no tensorboard. Every step is still persisted to
    # metrics/training_step_metrics.jsonl and rollout_tables/*.jsonl.
    logger_backends: []
  max_epochs: 100
  max_steps: -1
  only_eval: false
  # In-loop validation runs the fixed 50-seed suite on the Mesa renderer every
  # five steps (56 simulator slots, six padded and excluded from metrics).
  val_check_interval: 5
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  # Optional conservative embodied-GRPO update. Group-normalized positive
  # advantages reinforce better-than-group trajectories; zero/negative
  # advantages contribute no policy gradient. The reference KL remains active
  # on the whole rollout batch.
  positive_advantages_only: false
  # Optionally place positive-advantage chunks first while preserving random
  # order inside positive and zero-gradient partitions. This makes a capped
  # number of optimizer steps consume useful chunks before inactive ones.
  prioritize_positive_advantage_samples: false
  # Non-negative low-variance estimator for both the immutable StarVLA
  # reference-policy penalty and the proximal (old-vs-new policy) trust region.
  kl_penalty: low_var_kl
  group_size: 8
  reward_coef: 1.0
  # Four waves x 32 envs preserve 16 seed groups x 8 trajectories = 128.
  rollout_epoch: 4
  eval_rollout_epoch: 1
  reward_type: chunk_level
  # Per-scalar-action likelihood ratios. The executed chunk has 12 x 29 = 348
  # Gaussian dimensions with sigma = exp(-3.5) ~ 0.03; a chunk-level ratio sums
  # all 348 log-ratios, so a mean shift of 1% of the action range already gives
  # a chunk KL of ~77 and PPO clipping zeroes the gradient of most samples
  # (clip fraction 0.4-0.6 in earlier runs). Token-level ratios keep clipping
  # and the KL boundaries on a per-dimension scale, matching RLinf's
  # OpenVLA-OFT recipes.
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  # Initial reference-KL coefficient; adapted each update toward
  # `reference_target_kl` (see below) within [kl_beta_min, kl_beta_max].
  kl_beta: 0.001
  kl_beta_min: 1.0e-4
  kl_beta_max: 1.0
  kl_beta_adapt_factor: 2.0
  reference_forward_micro_batch_size: 4
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  # Proximal trust region (per-dimension low-variance KL between the rollout
  # policy and the pending update, averaged over the global batch). Remaining
  # minibatches are skipped once it is exceeded. This is the only hard stop.
  target_kl: 0.02
  # Reference leash measured against the immutable pretrained StarVLA
  # checkpoint (same per-dimension estimator). It no longer rejects optimizer
  # steps: a hard stop against a fixed reference can never recover once
  # exceeded. Instead kl_beta doubles when the mean reference KL of an update
  # exceeds 1.5x this target and halves when it drops below target/1.5.
  # 0.05 per dimension corresponds to a mean shift of ~0.3 sigma (~0.5% of the
  # normalized action range).
  reference_target_kl: 0.05
  # One full pass over the 7680 chunk samples is 15 optimizer steps at
  # global_batch_size 512; target_kl decides how many actually run.
  max_optimizer_steps_per_update: null
  # Re-evaluate sampled actions on the FSDP actor so PPO old/new ratios do not
  # amplify rollout-vs-actor numerical differences at small exploration std.
  # The recompute, reference, training and audit passes all use the same
  # micro-batch size, so they see bit-identical batch compositions.
  recompute_rollout_logprobs_on_actor: true
  actor_logprob_recompute_micro_batch_size: 4
  # Replay the sampled actions once after the optimizer update. This makes a
  # one-step update's realized movement observable instead of reporting only
  # the necessarily-zero pre-update KL.
  audit_post_update_logprobs: true
  post_update_logprob_audit_micro_batch_size: 4
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: 256
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    seed_manifest: ${oc.env:REPO_PATH}/examples/embodiment/config/seeds/robocasa_gr1_cup_drawer_train_500.json
    seed_pool_size: 500
    seed_sampler_seed: 20260820
    reward_coef: ${algorithm.reward_coef}
    # The task already exposes grasp / object-in-drawer signals for MimicGen.
    # Milestones are always tracked for diagnostics/video overlays. Enabling
    # this switch additionally converts them into a monotonic shaped return;
    # leaving it false keeps the training reward strictly binary success.
    subtask_reward_shaping:
      enabled: false
      grasp_object: 0.1
      obj_in_drawer: 0.5
      success: 1.0
    # Render training observations with the NVIDIA EGL device assigned to each
    # EnvWorker. A same-seed reset audit against the official Mesa evaluator
    # gives 0.555 / 255 pixel MAE, while avoiding CPU llvmpipe saturation.
    renderer_backend: nvidia
    llvmpipe_threads: null
    action_steps_per_chunk: 12
    max_episode_steps: 720
    video_cfg:
      save_video: true
      info_on_video: true
      fps: 20
      extra_info_on_video:
        - episode.success_once
        - episode.grasped_once
        - episode.obj_in_drawer_once
        - episode.grasp_first_step
        - episode.obj_in_drawer_first_step
        - episode.success_first_step
        - episode.sample_seed
        - episode.sample_group
        - episode.sample_trajectory
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    # Communication batches must divide evenly across the four env/rollout
    # workers. Six padded environments duplicate seeds but metric_valid
    # excludes them, so every reported validation rate is exactly the fixed
    # 50-seed suite.
    total_num_envs: 56
    group_size: 1
    is_eval: true
    seed_manifest: ${oc.env:REPO_PATH}/examples/embodiment/config/seeds/robocasa_gr1_cup_drawer_eval_50.json
    seed_pool_size: 50
    eval_seed_count: 50
    # Match StarVLA's published RoboCasa evaluator: predict 16 actions, execute
    # only the first 12, then replan. Sixty inference calls therefore execute
    # 720 MuJoCo control steps.
    action_steps_per_chunk: 12
    max_episode_steps: 720
    renderer_backend: mesa
    mesa_egl_device: 8
    llvmpipe_threads: 1
    video_cfg:
      save_video: true
      info_on_video: true
      fps: 20
      extra_info_on_video:
        - episode.success_once
        - episode.sample_seed
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  # Reset Gaussian action sampling after every actor-to-rollout sync. The
  # effective stream is base_seed + policy_version * world_size + rollout_rank,
  # making same-checkpoint hyperparameter comparisons use identical noise.
  training_sampling_seed: 20260821
  recompute_logprobs: false
  unnorm_key: ${actor.model.unnorm_key}
  enable_offload: false
  pipeline_stage_num: 1
  # One forward per rollout rank (8 envs). Batch-level numerical differences
  # against the actor are absorbed by recompute_rollout_logprobs_on_actor.
  inference_micro_batch_size: 8
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

weight_syncer:
  patch:
    # A resumed actor loads the saved OFT head while the rollout worker starts
    # from model_path. Bootstrap only the trainable head before the first
    # rollout so the initial patch snapshot cannot hide that difference. Do not
    # full-sync the frozen FSDP-DTensor backbone: that path corrupts the StarVLA
    # rollout copy on the current stack (pre-update KL ~2.1e5).
    init_sync:
      enabled: true
      # The fixed exploration buffer is configured per run and must not inherit
      # a stale value from the initialization checkpoint.
      prefixes: [starvla_model.action_model, actor_logstd]

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Fine-tune only the OFT head; the BF16 VLM backbone remains frozen.
  trainable_parameter_prefixes: [starvla_model.action_model]
  micro_batch_size: 4
  # Each optimizer step averages 512 chunk samples (15 steps per full pass).
  global_batch_size: 512
  seed: 42
  enable_offload: false
  model:
    model_path: /data/dengyixuan/wyz/models/StarVLA/Qwen3-VL-OFT-Robocasa/checkpoints/steps_90000_pytorch_model.pt
    model_type: starvla
    precision: bf16
    # Keep the trainable OFT head in FP32 so Adam updates do not disappear when
    # rounded back to the BF16 checkpoint grid. The backbone remains BF16.
    action_model_precision: fp32
    action_dim: 29
    num_action_chunks: 16
    # The checkpoint uses 16 action-query tokens, while the official evaluator
    # executes only the first 12 before replanning. PPO likelihoods must exclude
    # the four actions that never affect the environment.
    num_executed_action_chunks: 12
    # This task always tokenizes to 155 prompt tokens. Keeping the storage
    # length exact prevents replay from padding to 256, which otherwise changes
    # BF16 model numerics and makes actor logprobs differ from rollout logprobs.
    rollout_prompt_seq_len: 155
    num_steps: 16
    policy_setup: gr1
    unnorm_key: gr1
    action_stats_source: minmax
    add_value_head: false
    # Reduced exploration preserves more pretrained-policy successes while
    # still producing mixed-outcome GRPO groups (~80% of seed groups were mixed
    # at -3.5 versus 6% sampled success at -2.5). Keep it fixed across updates.
    initial_logstd: -3.5
    trainable_logstd: false
    use_proprio: false
    starvla:
      ckpt_path: ${actor.model.model_path}
      framework_name: QwenOFT
      expected_action_dim: ${actor.model.action_dim}
      expected_num_action_chunks: ${actor.model.num_action_chunks}
      expected_image_size: [224, 224]
      enable_state_input: false
  optim:
    # FP32 head. With Adam the per-step parameter movement is ~lr regardless
    # of gradient scale; 1e-6 moves the per-dimension log-probability by
    # ~4e-3 per optimizer step in earlier calibrations, i.e. a per-dimension
    # KL of ~2e-3 over a full 15-step pass, comfortably inside target_kl.
    # (1e-9 left most FP32 weights unchanged: it is below their ULP.)
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 0.01
    clip_grad: 2.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    # Required for a frozen BF16 backbone plus a trainable FP32 action head.
    use_orig_params: true
    # QwenOFT does not implement a checkpoint-safe forward; match RLinf's
    # official StarVLA recipe to avoid recomputing after FSDP frees shards.
    gradient_checkpointing: false
    # Preserve the checkpoint's native per-module dtypes. FSDP's BF16 forward
    # hook changes OFT action-head numerics relative to the unwrapped rollout
    # policy; with no hook, FULL_SHARD reproduces rollout logprobs exactly on
    # identical replay inputs.
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    # A separate FSDP unit prevents the root flat parameter from mixing the
    # BF16 backbone and FP32 OFT action head.
    wrap_policy:
      module_classes_to_wrap: [L1RegressionActionHead]

reward:
  use_reward_model: false

critic:
  use_critic_model: false
